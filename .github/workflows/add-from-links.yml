name: Sumar empresas desde links a avisos

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Links a avisos (de un newsletter, un post, etc.), separados por espacio o renglón"
        required: true
      via:
        description: "De dónde salieron (queda anotado en cada empresa)"
        required: false
        default: "links"

permissions:
  contents: write

concurrency:
  group: companies-edit-links
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar y sumar
        env:
          LINKS: ${{ github.event.inputs.links }}
          VIA: ${{ github.event.inputs.via }}
        run: node scripts/add-from-links.mjs

      - name: Guardar
        run: |
          git config user.name "open-seat-bot"
          git config user.email "open-seat-bot@users.noreply.github.com"
          cp data/companies.json "$RUNNER_TEMP/companies.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node -e '
              const fs=require("fs");
              const mine=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/companies.json","utf8"));
              const cur=JSON.parse(fs.readFileSync("data/companies.json","utf8"));
              const key=c=>c.ats+":"+c.slug.toLowerCase();
              const have=new Set(cur.companies.map(key));
              for(const c of mine.companies) if(!have.has(key(c))) cur.companies.push(c);
              fs.writeFileSync("data/companies.json",JSON.stringify(cur,null,2)+"\n");'
            git add data/companies.json
            if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
            git commit -q -m "Sumar empresas desde links a avisos"
            if git push -q origin HEAD:main; then echo "Guardado."; exit 0; fi
            sleep 5
          done
          exit 1
