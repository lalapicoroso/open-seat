name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://www.onstrider.com/jobs -o j.html; wc -c j.html
          echo "links:"; grep -oE '/jobs/[a-z0-9-]+-[0-9a-f]{8}' j.html | sort -u | wc -l
          grep -oE '__NEXT_DATA__|_next/data|api\.onstrider\.com[^"]{0,80}|graphql[^"]{0,60}|page=[0-9]+' j.html | sort -u | head
          for u in https://www.onstrider.com/sitemap.xml https://www.onstrider.com/robots.txt; do echo "== $u"; curl -sL "$u" | head -c 800; echo; done
          curl -sL https://www.onstrider.com/sitemap.xml | grep -oE 'onstrider\.com/jobs/[a-z0-9-]+' | wc -l
          curl -sL https://www.onstrider.com/sitemap.xml | grep -oE 'onstrider\.com/jobs/[a-z0-9-]+' | grep -iE 'design|ux|ui-|product' | head -20
