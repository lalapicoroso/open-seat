name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in api.manatal.com core.api.manatal.com; do for s in hr-oasis hroasis 1b7a51b4-b3a6-4fb9-9882-bba06f0b040e jobs.hroasis.com; do
            u="https://$h/open/v1/career-pages/$s/job-posts"; c=$(curl -s -o r -w "%{http_code}" "$u"); echo "$c $u"; [ "$c" = 200 ] && head -c 1500 r && echo; done; done
          curl -sL https://jobs.hroasis.com/ | grep -oiE '.{0,80}(UX|UI|dise|design|product)[^<]{0,80}' | sort -u | head -20
