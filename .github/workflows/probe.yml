name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://boards-api.eu.greenhouse.io/v1/boards/neoris/jobs https://eu.boards-api.greenhouse.io/v1/boards/neoris/jobs https://boards-api.greenhouse.io/v1/boards/neoris/jobs "https://job-boards.eu.greenhouse.io/embed/job_board/js?for=neoris" https://api.eu.greenhouse.io/v1/boards/neoris/jobs; do
            r=$(curl -s -m 15 -o b -w "%{http_code}" "$u" || echo ERR); echo "$r $u :: $(head -c 200 b 2>/dev/null | tr '\n' ' ')"; done
          curl -sL https://job-boards.eu.greenhouse.io/neoris -o h.html; wc -c h.html; grep -oE 'https?://[a-z.-]*greenhouse[a-z.-]*/[^"'"'"' ]{0,60}' h.html | sort -u | head -20
