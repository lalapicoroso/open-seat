name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          head -c 1500 <(curl -sL https://uxjobs.substack.com/feed); echo
          echo "== archive"; curl -sL "https://uxjobs.substack.com/api/v1/archive?sort=new&limit=20" | head -c 800; echo
          echo "== notes/about"; curl -sL https://uxjobs.substack.com/about | grep -oE '<meta (name|property)="(description|og:description)"[^>]*>' | head
