name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.manatal.com/open/v3/career-page/hr-oasis/jobs/?page_size=100" > r.json
          jq -c '.count, (.results|length), (.results[0]|del(.description)|del(.description_html))' r.json
          jq -r '.results[]|[.position_name,.hash,.location_display,.address,.city,.country,.contract_details,.is_remote,.created_at]|@tsv' r.json
