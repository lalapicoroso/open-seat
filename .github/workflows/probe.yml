name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://floowi.na.teamtailor.com/jobs.rss -o f.xml; wc -c f.xml; grep -c "<item>" f.xml
          python3 - <<'PY'
          import re
          s=open("f.xml").read()
          it=s.split("<item>")[1].split("</item>")[0]
          print(re.sub(r"<description>.*?</description>","<description>…</description>",it,flags=re.S)[:2500])
          print("TITLES", re.findall(r"<title>(.*?)</title>", s)[:25])
          PY
          curl -s -o /dev/null -w "plain-host %{http_code} %{redirect_url}\n" https://floowi.teamtailor.com/jobs.rss
          for s in deerdesigner bairesdev nearsure jobgether toptal lemon wizeline howdy southteams workana; do c=$(curl -s -m 10 -o t -w "%{http_code}" https://$s.breezy.hr/json); echo "breezy $s $c $(head -c 1 t)"; if [ "$c" = 200 ] && [ "$(head -c 1 t)" = "[" ]; then jq -c '.[0]|del(.description)' t | head -c 1500; echo; break; fi; done
